<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="join-screen">
    <div class="theme-top">
      <button id="theme-btn-join" title="Toggle theme">🌙</button>
    </div>

  <h1>Private Room Chat</h1>

  <input id="nickname" placeholder="Nickname" maxlength="20" />
  <input id="room" placeholder="Room code (e.g. friends123)" />
  <input id="passphrase" type="password" placeholder="Room secret (shared with friends)" />
  <button id="join-btn">Join Room</button>
  <p class="hint">Anyone with the same room code + secret can chat. Server cannot read messages.</p>
</div>

  <div id="chat-screen" class="hidden">
   <header>
    <div class="header-left">
      <span id="room-name"></span>
      <span id="users-count"></span>
    </div>
    <div class="header-right">
      <button id="theme-btn" title="Toggle theme">🌙</button>
      <button id="invite-btn" title="Copy invite link">Invite</button>
      <button id="leave-btn" title="Leave room">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </header>
    <div id="messages"></div>
    <form id="message-form">
      <input id="message-input" placeholder="Type smth..." autocomplete="off" />
      <button type="submit">→</button>
    </form>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
